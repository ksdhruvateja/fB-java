<nav class="bnav" aria-label="Main navigation">
  <ul>
    <li>
      <button type="button" [class.active]="active === 'home'" (click)="on('home')">

      </button>
    </li>
    <li>
      <button type="button" [class.active]="active === 'jobs'" (click)="on('jobs')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>

      </button>

    <li class="bnav__center">
      <button type="button" class="bnav__plus" aria-label="Request service" [attr.aria-current]="active === 'request' ? 'page' : null" (click)="on('request')">

    <li>

            <span class="bnav__badge">{{ inboxBadge }}</span>
          }

        Messages
      </button>

    <li>
      <button type="button" [class.active]="active === 'more'" (click)="on('more')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>

      </button>
