<section class="reset">
  <div class="fb-card reset__panel">
    <p class="reset__eyebrow">FixBridge</p>
    <h1>Reset password</h1>
    <p class="reset__sub">Choose a new password for your {{ role }} account.</p>

    <form class="reset__form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="fb-field">
        <label for="password">New password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      </div>
      <div class="fb-field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" formControlName="confirm" autocomplete="new-password" />
      </div>

      @if (message) {
        <p [class]="success ? 'reset__ok' : 'fb-error'" role="status">{{ message }}</p>
      }

      <button class="fb-btn fb-btn-primary" type="submit" [disabled]="loading">
        {{ loading ? 'Saving…' : 'Update password' }}
      </button>
    </form>

    <p class="reset__links">
      <a routerLink="/auth/homeowner">Homeowner login</a>
      ·
      <a routerLink="/auth/contractor">Contractor login</a>
    </p>
  </div>
</section>
