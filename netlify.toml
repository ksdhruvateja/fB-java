# LEGACY HOST — not production.
# Production is Railway: https://fb-java-production.up.railway.app
# Source of truth: ksdhruvateja/fB-java main
#
# If this repo is connected to Netlify, send every request to Railway so
# visitors cannot get a second, stale frontend + API.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_CONFIG_PRODUCTION = "false"
  VITE_SITE_URL = "https://fb-java-production.up.railway.app"
  APP_URL = "https://fb-java-production.up.railway.app"

[context.production.environment]
  FIXBRIDGE_HOSTING = "railway"
  APP_URL = "https://fb-java-production.up.railway.app"

# Send the entire leftover Netlify hostname to Railway, including /api.
[[redirects]]
  from = "/*"
  to = "https://fb-java-production.up.railway.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
