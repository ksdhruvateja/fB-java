<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FixBridge — AI-Powered Home Repair &amp; Property Care</title>
    <meta
      name="description"
      content="AI-powered property care and service coordination. Get transparent quotes, verified providers, and coordinated home repairs."
    />

    <!-- Favicons & install icons. favicon.ico first so Chrome's tab uses the logo, not the SPA HTML fallback. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FixBridge" />
    <meta property="og:title" content="FixBridge — AI-Powered Home Repair &amp; Property Care" />
    <meta
      property="og:description"
      content="AI-powered property care and service coordination. Get transparent quotes, verified providers, and coordinated home repairs."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FixBridge logo" />
    <meta property="og:url" content="%SITE_URL%/" />

    <!-- Twitter / iMessage / Slack -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FixBridge — AI-Powered Home Repair &amp; Property Care" />
    <meta
      name="twitter:description"
      content="AI-powered property care and service coordination. Get transparent quotes, verified providers, and coordinated home repairs."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="FixBridge logo" />

    <meta name="application-name" content="FixBridge" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0C0C" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="FixBridge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        overflow-x: hidden;
      }
      html, body {
        background: #ffffff;
        color: #0a0a0a;
      }
      html.dark, html.dark body {
        background: #0c0c0c;
        color: #f0ebe3;
      }
    </style>
    <script>
      (function () {
        try {
          var dark = localStorage.getItem("fixbridge-theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
